name: Delist Queue Export (read-only)

# Reads the Google Sheet only (no OnBuy, no Supabase, no writes anywhere): the entries of the "Delist Queue" tab that are
# not deleted yet, with the ones OnBuy keeps refusing as suspended counted. Outside the onbuy-api group.

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Export
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python delist_queue_export.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delist-queue
          path: out/
          if-no-files-found: ignore
