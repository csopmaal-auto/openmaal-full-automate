name: Mark Failed For Resubmit

on:
  workflow_dispatch:
    inputs:
      skus:
        description: "Comma-separated SKUs whose creation OnBuy confirmed as FAILED"
        required: true
      dry_run:
        description: "yes = list; no = flip Sync Status"
        required: false
        default: "yes"

jobs:
  flip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Flip
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SKUS: ${{ inputs.skus }}
          DRY_RUN: ${{ inputs.dry_run == 'no' && '0' || '1' }}
        run: python mark_failed_resubmit.py
