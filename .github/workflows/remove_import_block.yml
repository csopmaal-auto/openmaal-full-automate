name: Remove Import Block

on:
  workflow_dispatch:
    inputs:
      block_start:
        description: "First sheet row number of the appended import block"
        required: true
      dry_run:
        description: "yes = list; no = delete the remaining imported rows"
        required: false
        default: "yes"
      lift_status_guard:
        description: "1 = also delete block rows whose status is not Synced"
        required: false
        default: ""
      delete_adopted:
        description: "1 = also delete team-adopted block rows (URL/cost filled) + purge their Supabase mirror rows"
        required: false
        default: ""
      block_end:
        description: "Optional inclusive last row of the block (fences off newer team rows below it)"
        required: false
        default: ""

# Mutates sheet row numbers - must never overlap a sync/backfill/buybox run
# mid-flight (their row writes would land on shifted rows).
concurrency:
  group: onbuy-api
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Remove
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          BLOCK_START: ${{ inputs.block_start }}
          LIFT_STATUS_GUARD: ${{ inputs.lift_status_guard }}
          DELETE_ADOPTED: ${{ inputs.delete_adopted }}
          BLOCK_END: ${{ inputs.block_end }}
          DRY_RUN: ${{ inputs.dry_run == 'no' && '0' || '1' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python remove_import_block.py
